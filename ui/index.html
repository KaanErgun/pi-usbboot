<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CM5 USB Boot</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1 data-i18n="title"></h1>
        <p class="muted" data-i18n="subtitle"></p>
      </header>

      <section class="card">
        <div class="row">
          <span class="dot" id="device-dot"></span>
          <div>
            <h2 data-i18n="step.device"></h2>
            <p id="device-text"></p>
            <p class="muted small" id="device-help" data-i18n="device.help"></p>
          </div>
        </div>
        <div class="row">
          <span class="dot" id="rpiboot-dot"></span>
          <div>
            <h2 data-i18n="step.rpiboot"></h2>
            <p id="rpiboot-text"></p>
            <code id="rpiboot-install" hidden></code>
          </div>
        </div>
        <div class="row">
          <span class="dot" id="disks-dot"></span>
          <div class="grow">
            <h2 data-i18n="step.disks"></h2>
            <ul id="disks"></ul>
            <p class="hint" id="mmc-hint" data-i18n="hint.mmc_only" hidden></p>
          </div>
        </div>
      </section>

      <section class="actions">
        <button id="start" class="primary" data-i18n="action.start"></button>
        <button id="imager" data-i18n="action.imager"></button>
        <label class="option">
          <input type="checkbox" id="pcie" />
          <span>
            <span data-i18n="option.pcie"></span>
            <span class="muted small block" data-i18n="option.pcie_help"></span>
          </span>
        </label>
      </section>

      <section>
        <h2 data-i18n="log.title"></h2>
        <pre id="log"></pre>
      </section>

      <footer class="muted small" id="version"></footer>
    </main>
  </body>
</html>
