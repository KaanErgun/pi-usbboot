<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi USB Boot</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1 data-i18n="title"></h1>
        <p class="muted" data-i18n="subtitle"></p>
      </header>

      <section class="card">
        <div class="row">
          <span class="dot" id="device-dot"></span>
          <div class="grow">
            <h2 data-i18n="step.device"></h2>
            <p id="device-text"></p>
            <details class="muted small" id="device-help">
              <summary data-i18n="device.help"></summary>
              <ul class="preparation">
                <li data-i18n="device.prepare.cm"></li>
                <li data-i18n="device.prepare.pi5"></li>
                <li data-i18n="device.prepare.pi4"></li>
                <li data-i18n="device.prepare.older"></li>
              </ul>
            </details>
          </div>
        </div>
        <div class="row">
          <span class="dot" id="rpiboot-dot"></span>
          <div class="grow">
            <h2 data-i18n="step.rpiboot"></h2>
            <p id="rpiboot-text"></p>
          </div>
        </div>
        <div class="row">
          <span class="dot" id="boot-dot"></span>
          <div class="grow">
            <h2 data-i18n="step.storage"></h2>
            <p id="mode-text"></p>
            <p class="muted small" id="boot-text" hidden></p>
            <p class="hint small" id="boot-help" data-i18n="boot.help" hidden></p>
          </div>
        </div>
        <div class="row">
          <span class="dot" id="disks-dot"></span>
          <div class="grow">
            <h2 data-i18n="step.disks"></h2>
            <ul id="disks"></ul>
          </div>
        </div>
      </section>

      <section class="actions">
        <button id="start" class="primary" data-i18n="action.start" disabled></button>
        <button id="imager" data-i18n="action.imager" disabled></button>
      </section>

      <section>
        <h2 data-i18n="log.title"></h2>
        <pre id="log"></pre>
      </section>

      <footer class="muted small" id="version"></footer>
    </main>
  </body>
</html>
