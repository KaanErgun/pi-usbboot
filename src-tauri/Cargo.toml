[package]
name = "cm5-usbboot"
version = "0.1.0"
description = "Expose a Raspberry Pi Compute Module's eMMC/NVMe as a USB disk via rpiboot"
authors = ["Kaan Ergun <kaanergun@me.com>"]
license = "MIT"
repository = "https://github.com/KaanErgun/cm5-usbboot"
edition = "2021"
rust-version = "1.80"

[lib]
name = "cm5_usbboot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.2"
