[package]
name = "pi-usbboot"
version = "0.2.0"
description = "Expose storage on RPIBOOT-compatible Raspberry Pi boards over USB"
authors = ["Kaan Ergun <kaanergun@me.com>"]
license = "MIT"
repository = "https://github.com/KaanErgun/pi-usbboot"
edition = "2021"
rust-version = "1.80"

[lib]
name = "pi_usbboot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.2"
